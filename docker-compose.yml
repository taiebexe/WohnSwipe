version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: wohnswipe-db
    environment:
      POSTGRES_USER: wohnswipe
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wohnswipe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wohnswipe"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: wohnswipe-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wohnswipe
      SPRING_DATASOURCE_USERNAME: wohnswipe
      SPRING_DATASOURCE_PASSWORD: password
      AI_SERVICE_URL: http://ai-service:8000
      SPRING_MAIL_HOST: ${SMTP_HOST:-smtp.sendgrid.net}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-apikey}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@wohnswipe.de}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  ai-service:
    build: ./ai-service
    container_name: wohnswipe-ai-service
    ports:
      - "8000:8000"
    restart: on-failure

  scraper-service:
    build: ./scraper-service
    container_name: wohnswipe-scraper
    environment:
      DATABASE_URL: postgresql://wohnswipe:password@db:5432/wohnswipe
      SCRAPE_INTERVAL_HOURS: 4
      MAX_LISTINGS_PER_RUN: 30
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: wohnswipe-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
